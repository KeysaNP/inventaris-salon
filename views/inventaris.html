        <div class="profile-content">
            <div class="profile">
                <div class="profile_details">
                    <img src="https://imgur.com" alt="profileImg">

                        <div class="name">Sari</div>
                        <div class="job">(Admin)</div>
                    </div>
                </div>

    <!-- =============== KONTEN UTAMA DUAL COLUMNS =============== -->
    <div class="main-container">
        <div class="header-title">Inventaris</div>

        <!-- KOLOM KIRI INPUT BARANG DATANG -->
        <div class="services-area">
            <div class="section-box">
                <div class="section-title">📥 Input Barang Masuk</div>
                
                <form method="POST" action="../proses_inventaris.php">
                    <div class="form-group">
                        <label>Nama Barang Gudang</label>
                        <input type="text" name="nama_barang" placeholder="Contoh: Krim Rebonding Makarizo" required>
                    </div>
                    <div class="grid-2col">
                        <div class="form-group">
                            <label>Harga Beli Total (Rp)</label>
                            <input type="number" name="harga_beli" placeholder="400000" required>
                        </div>
                        <div class="form-group">
                            <label>Isi / Berat Kulakan</label>
                            <input type="number" step="any" name="jumlah" placeholder="1" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Satuan Pembelian</label>
                        <select name="satuan">
                            <option value="kg">Kilogram (Kg)</option>
                            <option value="liter">Liter</option>
                            <option value="gram">Gram</option>
                            <option value="ml">Mililitir (Ml)</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-pay">Hitung & Konversi via PHP</button>
                </form>
            </div>
        </div>

        <!-- KOLOM KANAN MONITORING STOK & TAUTAN BERANDA UTAMA SHOPEE -->
        <div class="form-area">
            <div class="section-box">
                <div class="section-title">📊 Kondisi Stok Terkini</div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Barang</th>
                            <th>Sisa Stok</th>
                            <th>Aksi Belanja</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Krim Rebonding Makarizo</td>
                            <td><strong>850 gram</strong></td>
                            <td>
                                <!-- Tautan Shopee -->
                                <a href="https://shopee.co.id" target="_blank" class="btn-shopee">❤️ Beli</a>
                            </td>
                        </tr>
                        <tr>
                            <td>Sampo L'Oréal</td>
                            <td><strong style="color: red;">4 ml ⚠️</strong></td>
                            <td>
                                <a href="https://shopee.co.id" target="_blank" class="btn-shopee">❤️ Beli Cepat</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
